name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 自检里有大量 Windows 路径（C:\ 盘符、.versions\ 分隔符），所以固定跑 Windows runner。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # DSH 宿主随包发的 Node 是 24，22 是下限——两边都验一遍
        node-version: [22, 24]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 三套自检
        run: npm test
